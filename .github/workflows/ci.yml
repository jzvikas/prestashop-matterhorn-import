name: Matterhorn Import CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: matterhorn-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  php84-static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, fileinfo, simplexml, xmlreader, dom, mbstring
          coverage: none
      - name: Validate Composer metadata
        run: composer validate --no-check-publish
      - name: Install production Composer runtime
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader
      - name: Matterhorn static/parser/mapper checks
        run: bash tests/static-release-check.sh

  mariadb-lifecycle:
    needs: php84-static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: matterhorn_test
        ports:
          - 3306:3306
    steps:
      - uses: actions/checkout@v5
      - name: PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mysqli
          coverage: none
      - name: Wait for MariaDB
        env:
          LP_DB_HOST: 127.0.0.1
          LP_DB_PORT: 3306
          LP_DB_USER: root
          LP_DB_PASSWORD: root
          LP_DB_NAME: matterhorn_test
        run: |
          for attempt in $(seq 1 30); do
            if php -r '$db=@new mysqli(getenv("LP_DB_HOST"),getenv("LP_DB_USER"),getenv("LP_DB_PASSWORD"),getenv("LP_DB_NAME"),(int)getenv("LP_DB_PORT")); exit($db->connect_errno ? 1 : 0);'; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Matterhorn schema lifecycle
        env:
          LP_DB_HOST: 127.0.0.1
          LP_DB_PORT: 3306
          LP_DB_USER: root
          LP_DB_PASSWORD: root
          LP_DB_NAME: matterhorn_test
          LP_DB_PREFIX: mh_
        run: |
          php tests/database-lifecycle-check.php
          php tests/image-placement-mariadb-check.php
          php tests/image-authoritative-manifest-mariadb-check.php

  prestashop-runtime:
    needs: php84-static
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - name: PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, fileinfo, simplexml, xmlreader, dom, mbstring
          coverage: none
      - name: Install production Composer runtime
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader
      - name: Pre-pull runtime images in parallel
        shell: bash
        run: |
          set -euo pipefail
          docker pull mariadb:10.11 &
          mariadb_pull=$!
          docker pull prestashop/prestashop:9.1.5-8.4 &
          prestashop_pull=$!
          wait "$mariadb_pull"
          wait "$prestashop_pull"
      - name: PrestaShop 9.1.5 install multishop and uninstall lifecycle
        run: bash tests/prestashop-runtime-check.sh
