name: Matterhorn Import CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  php84-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, fileinfo, simplexml, xmlreader, dom, mbstring
          coverage: none
      - name: Validate Composer metadata
        run: composer validate --no-check-publish
      - name: Install production Composer runtime
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader
      - name: Matterhorn static/parser/mapper checks
        run: bash tests/static-release-check.sh
