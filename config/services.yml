services:
  _defaults:
    public: false
    autowire: true
    autoconfigure: true

  Lp\MatterhornImport\:
    resource: '../src/'
    exclude:
      - '../src/Contract/'
      - '../src/DTO/'
      - '../src/Form/ConfigurationFormType.php'
      - '../src/Form/CategoryMappingFormType.php'
      - '../src/Installer.php'

  Lp\MatterhornImport\Form\ConfigurationFormType:
    parent: 'form.type.translatable.aware'
    autowire: false
    autoconfigure: false
    tags:
      - { name: form.type }

  Lp\MatterhornImport\Form\CategoryMappingFormType:
    parent: 'form.type.translatable.aware'
    autowire: false
    autoconfigure: false
    tags:
      - { name: form.type }

  matterhornimport.form.configuration_handler:
    class: PrestaShop\PrestaShop\Core\Form\Handler
    arguments:
      - '@form.factory'
      - '@prestashop.core.hook.dispatcher'
      - '@Lp\MatterhornImport\Form\ConfigurationFormDataProvider'
      - 'Lp\MatterhornImport\Form\ConfigurationFormType'
      - 'MatterhornImportConfiguration'

  Lp\MatterhornImport\Contract\SourceInterface:
    alias: Lp\MatterhornImport\Source\ConfiguredMatterhornXmlSource

  Lp\MatterhornImport\Contract\ProductMapperInterface:
    alias: Lp\MatterhornImport\Mapper\MatterhornProductMapper

  Lp\MatterhornImport\Contract\SizeResolverInterface:
    alias: Lp\MatterhornImport\Matterhorn\MatterhornSizeResolver

  Lp\MatterhornImport\Contract\ProductWriterInterface:
    alias: Lp\MatterhornImport\Product\MatterhornProductWriter

  Lp\MatterhornImport\Contract\OutOfFeedPolicyInterface:
    alias: Lp\MatterhornImport\Product\DeactivateOutOfFeedPolicy
